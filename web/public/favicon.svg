<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="signaFaviconGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
  </defs>

  <!-- Disque vert émeraude plein -->
  <circle cx="50" cy="50" r="48" fill="url(#signaFaviconGrad)" />

  <!-- Anneau blanc intérieur -->
  <path
    d="M 24 76 A 37 37 0 1 1 87 50 A 37 37 0 0 1 66 84"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Clef blanche inclinée à 45° -->
