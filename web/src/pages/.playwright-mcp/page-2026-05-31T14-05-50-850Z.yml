                - listitem [ref=e327]:
                  - text: 
                  - strong [ref=e328]: Mettre en avant vos projets
                  - text: ": Présentez vos projets passés et actuels en développement web, et expliquez votre rôle dans chacun."
                - listitem [ref=e329]:
                  - text: 
