name: Build Android APK (TWA)

on:
  push:
    branches: [main]
    paths:
      - 'twa/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools & platform
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > twa/civic-signal.keystore

      - name: Build APK with Bubblewrap
        working-directory: twa
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --manifest twa-manifest.json

      - name: Rename APK
        run: |
          find twa -name "*.apk" | head -5
          cp twa/app-release-signed.apk SIGNA-CI-v1.0.apk 2>/dev/null || \
          cp twa/app/build/outputs/apk/release/*.apk SIGNA-CI-v1.0.apk 2>/dev/null || \
          find twa -name "*.apk" -exec cp {} SIGNA-CI-v1.0.apk \; 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIGNA-CI-APK
          path: SIGNA-CI-v1.0.apk
          retention-days: 30
