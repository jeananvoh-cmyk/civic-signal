<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors-ligne — SIGNA-CI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p  { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; max-width: 340px; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      margin-top: 1.5rem;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 9999px; padding: 0.4rem 1rem;
      font-size: 0.8rem; color: #f59e0b;
    }
    button {
      margin-top: 2rem;
      background: #6366f1; color: #fff;
      border: none; border-radius: 0.75rem;
      padding: 0.75rem 2rem;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    button:hover { opacity: 0.85; }
    .note { margin-top: 1rem; font-size: 0.78rem; color: #475569; }
  </style>
</head>
<body>
  <div class="icon">📶</div>
  <h1>Vous êtes hors-ligne</h1>
  <p>Vérifiez votre connexion réseau. Les signalements créés hors-ligne seront envoyés automatiquement à votre retour en ligne.</p>
  <div class="badge">
    <span>●</span> SIGNA-CI — Abidjan
  </div>
  <button onclick="location.reload()">🔄 Réessayer</button>
  <p class="note">Si vous aviez commencé un signalement, il a été sauvegardé.</p>
</body>
</html>
